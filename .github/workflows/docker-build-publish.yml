name: Test and build fork image

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
    tags: ['v*-hoodhaus.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    if: github.repository == 'mahood73/bookkeep'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - name: Set up runtime Python
        run: uv python install 3.11
      - name: Install test dependencies
        working-directory: backend
        run: uv sync --locked --dev --python 3.11
      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/bookkeep-ci.db
        run: uv run --no-sync pytest tests/ -v

  build:
    if: github.repository == 'mahood73/bookkeep'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: APP_VERSION=hoodhaus-${{ github.sha }}

  publish:
    # Only deliberately pushed fork release tags can publish. PRs, branch pushes
    # and manual validation runs have no registry write permission or login.
    if: >-
      github.repository == 'mahood73/bookkeep' &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      contains(github.ref_name, '-hoodhaus.')
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag and source
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-hoodhaus\.[0-9]+$ ]]; then
            echo 'Expected a fork release tag such as v1.6.2-hoodhaus.1' >&2
            exit 1
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/develop
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish only the fork image
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/mahood73/bookkeep:${{ github.ref_name }}
            ghcr.io/mahood73/bookkeep:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/mahood73/bookkeep
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          build-args: APP_VERSION=${{ github.ref_name }}
      - name: Record immutable image reference
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          printf 'Published image: ghcr.io/mahood73/bookkeep@%s\n' "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
